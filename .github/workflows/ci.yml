# Vets and tests every push to main and every pull request. The repository is
# public, so Actions minutes are free and this is where CI belongs (unlike the
# private repos whose CI runs on the workstation). release.yml runs the same
# checks again on a tag before it publishes anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
